<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小树苗医生大冒险 · 循证儿科亲子闯关</title>
<meta name="description" content="基于循证儿科医学知识的亲子闯关游戏，十五大主题关卡：喂养、睡眠、发热、咳嗽、成长、安全、皮肤、新生儿、情绪、就医、吐泻、流感、用药、急救等，家长学判断，宝宝养习惯。" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 纸张颗粒纹理 -->
  <svg class="grain-defs" width="0" height="0" aria-hidden="true">
    <filter id="paper-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </svg>
  <div class="grain-overlay" aria-hidden="true"></div>

  <div id="app">

    <!-- ============ 首页 ============ -->
    <section class="screen screen-home is-active" id="screen-home">
      <div class="hero-parallax" aria-hidden="true">
        <svg class="hero-hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path class="hill hill-back" d="M0,220 C240,160 420,260 720,210 C980,168 1180,250 1440,200 L1440,320 L0,320 Z" />
          <path class="hill hill-front" d="M0,270 C260,230 480,300 760,265 C1020,232 1220,300 1440,258 L1440,320 L0,320 Z" />
        </svg>
      </div>

      <header class="home-top">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" class="brand-sapling" aria-hidden="true">
            <path d="M24 44 L24 22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M24 30 C16 28 12 20 12 14 C20 14 26 20 24 30 Z" fill="currentColor" opacity=".85"/>
            <path d="M24 24 C32 22 36 14 36 8 C28 8 22 14 24 24 Z" fill="currentColor"/>
          </svg>
          <span>小树苗医生大冒险</span>
        </div>
        <a class="site-link" href="https://www.yanyisheng.vip" target="_blank" rel="noopener">知识来源 · yanyisheng.vip</a>
      </header>

      <div class="hero">
        <p class="hero-kicker">循证儿科 · 亲子共学 · 十五关冒险</p>
        <h1 class="hero-title">
          <span class="outline-word">变成小医生</span>
          <span class="solid-word">守护<span class="accent">小树苗</span></span>
        </h1>
        <p class="hero-sub">每一关的医学知识，都来自循证儿科临床实践。<br />家长学判断，宝宝养习惯，一起闯关一起长大。</p>

        <div class="mode-select">
          <button class="push-btn push-btn--big" data-mode="parent">
            <span class="push-btn-label">家长闯关</span>
            <span class="push-btn-hint">情境选择题 · 考判断力</span>
          </button>
          <button class="push-btn push-btn--big push-btn--gold" data-mode="kid">
            <span class="push-btn-label">宝宝闯关</span>
            <span class="push-btn-hint">简单判断题 · 3 岁以上</span>
          </button>
        </div>
      </div>

      <div class="home-train-lane" aria-hidden="true">
        <div class="home-rail"></div>
        <div class="home-train" id="home-train">
          <div class="home-smoke" id="home-smoke"></div>
          <svg viewBox="0 0 120 70" class="home-engine">
            <rect x="12" y="8" width="10" height="14" rx="2.5" class="t-ink"/>
            <rect x="10" y="5" width="14" height="5" rx="2.5" class="t-gold"/>
            <rect x="8" y="22" width="58" height="24" rx="11" class="t-ink2"/>
            <circle cx="54" cy="34" r="6.5" class="t-paper"/>
            <circle cx="54" cy="34" r="3" class="t-gold"/>
            <path d="M8 27 L2 33 L2 44 L8 46 Z" class="t-gold"/>
            <rect x="68" y="14" width="34" height="32" rx="5" class="t-ink"/>
            <rect x="73" y="19" width="17" height="13" rx="2.5" class="t-gold"/>
            <rect x="2" y="46" width="104" height="6" rx="3" class="t-gold-deep"/>
            <circle cx="22" cy="55" r="8" class="t-wheel"/><circle cx="22" cy="55" r="3" class="t-gold"/>
            <circle cx="48" cy="55" r="8" class="t-wheel"/><circle cx="48" cy="55" r="3" class="t-gold"/>
            <circle cx="82" cy="55" r="8" class="t-wheel"/><circle cx="82" cy="55" r="3" class="t-gold"/>
          </svg>
          <span class="home-car home-car--sprout">
            <svg viewBox="0 0 48 48" class="car-sapling"><path d="M24 42 L24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M24 31 C17 29 13 22 13 16 C20 16 25 22 24 31 Z" fill="currentColor" opacity=".85"/><path d="M24 26 C31 24 35 17 35 11 C28 11 23 17 24 26 Z" fill="currentColor"/></svg>
            好好吃饭
          </span>
          <span class="home-car">甜甜梦乡</span>
          <span class="home-car">发烧不慌</span>
          <span class="home-car">咳嗽与呼吸</span>
          <span class="home-car home-car--gold">…共 15 站</span>
        </div>
      </div>

      <div class="torn-edge torn-edge--bottom" aria-hidden="true">
        <svg viewBox="0 0 1440 44" preserveAspectRatio="none"><path d="M0,44 L0,22 L38,30 L72,14 L120,26 L166,10 L214,28 L262,16 L310,30 L358,12 L410,26 L462,14 L512,30 L560,16 L612,26 L660,10 L712,28 L760,16 L812,30 L862,14 L914,26 L964,12 L1014,28 L1064,18 L1116,30 L1166,14 L1218,26 L1268,12 L1320,28 L1372,16 L1440,24 L1440,44 Z"/></svg>
      </div>
    </section>

    <!-- ============ 关卡地图 ============ -->
    <section class="screen screen-map" id="screen-map">
      <header class="map-header">
        <button class="pill-btn" id="btn-back-home">← 首页</button>
        <div class="map-title-wrap">
          <h2 class="map-title outline-word" id="map-mode-title">闯关地图</h2>
        </div>
        <div class="score-board">
          <div class="score-item"><span class="score-label">总星星</span><span class="score-value" id="board-stars">0</span></div>
          <div class="score-item"><span class="score-label">总分</span><span class="score-value" id="board-score">0</span></div>
          <button class="pill-btn pill-btn--gold" id="btn-orchard">
            <svg viewBox="0 0 48 48" class="pill-sapling" aria-hidden="true"><path d="M24 42 L24 24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M24 31 C17 29 13 22 13 16 C20 16 25 22 24 31 Z" fill="currentColor" opacity=".85"/><path d="M24 26 C31 24 35 17 35 11 C28 11 23 17 24 26 Z" fill="currentColor"/></svg>
            果园
          </button>
        </div>
      </header>

      <div class="station-scene">
        <div class="station-viewport" id="station-viewport">
          <div class="station-track" id="station-track">
            <div class="station-sky" aria-hidden="true"><span class="station-moon"></span></div>
            <div class="station-hills" aria-hidden="true"></div>
            <!-- 站牌由 JS 生成 -->
            <div class="rail-wrap" aria-hidden="true">
              <div class="rail-sleepers"></div>
              <div class="rail rail-a"></div>
              <div class="rail rail-b"></div>
            </div>
            <div class="train" id="train" aria-hidden="true">
              <div class="train-smoke" id="train-smoke"></div>
              <svg viewBox="0 0 190 96" class="train-svg">
                <!-- 烟囱 -->
                <rect x="16" y="14" width="14" height="20" rx="3" class="t-ink"/>
                <rect x="13" y="10" width="20" height="7" rx="3.5" class="t-gold"/>
                <!-- 锅炉 -->
                <rect x="10" y="34" width="86" height="34" rx="15" class="t-ink2"/>
                <circle cx="82" cy="51" r="9" class="t-paper"/>
                <circle cx="82" cy="51" r="4.5" class="t-gold"/>
                <!-- 车头前脸 -->
                <path d="M10 42 L2 50 L2 66 L10 68 Z" class="t-gold"/>
                <!-- 驾驶室 -->
                <rect x="98" y="22" width="52" height="46" rx="6" class="t-ink"/>
                <rect x="106" y="30" width="26" height="18" rx="3" class="t-gold"/>
                <path d="M118 22 L112 10 L124 10 Z" class="t-ink"/>
                <!-- 车厢 -->
                <rect x="154" y="36" width="32" height="32" rx="5" class="t-ink2"/>
                <rect x="160" y="42" width="20" height="12" rx="2.5" class="t-paper"/>
                <!-- 底盘 -->
                <rect x="2" y="68" width="186" height="8" rx="4" class="t-gold-deep"/>
                <!-- 车轮 -->
                <g class="train-wheels">
                  <circle cx="30" cy="80" r="11" class="t-wheel"/><circle cx="30" cy="80" r="4" class="t-gold"/>
                  <circle cx="66" cy="80" r="11" class="t-wheel"/><circle cx="66" cy="80" r="4" class="t-gold"/>
                  <circle cx="120" cy="80" r="11" class="t-wheel"/><circle cx="120" cy="80" r="4" class="t-gold"/>
                  <circle cx="168" cy="80" r="9" class="t-wheel"/><circle cx="168" cy="80" r="3.5" class="t-gold"/>
                </g>
              </svg>
            </div>
          </div>
        </div>

        <div class="station-panel" id="station-panel">
          <div class="station-panel-info">
            <span class="sp-num" id="sp-num">第 1 站</span>
            <h3 class="sp-name" id="sp-name">好好吃饭</h3>
            <p class="sp-desc" id="sp-desc"></p>
            <p class="sp-stars" id="sp-stars"></p>
          </div>
          <button class="push-btn push-btn--gold" id="btn-station-start">
            <span class="push-btn-label">开始闯关</span>
            <span class="push-btn-hint">呜—— 出发！</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ 小树苗果园 ============ -->
    <section class="screen screen-orchard" id="screen-orchard">
      <header class="map-header">
        <button class="pill-btn" id="btn-back-map">← 地图</button>
        <div class="map-title-wrap">
          <h2 class="map-title outline-word">小树苗果园</h2>
        </div>
        <div class="score-board">
          <div class="score-item"><span class="score-label">总星星</span><span class="score-value" id="orchard-stars">0</span></div>
        </div>
      </header>
      <p class="orchard-sub" id="orchard-sub">每通关一站，果园里就多一棵大树，星星越多金果越多</p>
      <div class="orchard-grid" id="orchard-grid"></div>
    </section>

    <!-- ============ 答题 ============ -->
    <section class="screen screen-quiz" id="screen-quiz">
      <header class="quiz-header">
        <button class="pill-btn" id="btn-quit-level">← 地图</button>
        <div class="quiz-world-tag" id="quiz-world-tag">第 1 关</div>
        <div class="quiz-hud">
          <div class="hud-hearts" id="hud-hearts" aria-label="生命值"></div>
          <div class="hud-stat"><span class="score-label">得分</span><span class="score-value" id="hud-score">0</span></div>
          <div class="hud-stat"><span class="score-label">连击</span><span class="score-value" id="hud-streak">0</span></div>
        </div>
      </header>

      <div class="quiz-progress"><div class="quiz-progress-bar" id="quiz-progress-bar"></div></div>

      <div class="quiz-garden" aria-hidden="true">
        <div class="quiz-plant" id="quiz-plant"></div>
        <div class="garden-ground"></div>
        <p class="plant-label" id="plant-label">小种子睡着了</p>
      </div>

      <main class="quiz-main">
        <div class="question-card" id="question-card">
          <p class="question-scene" id="question-scene"></p>
          <h3 class="question-text" id="question-text"></h3>
          <div class="options-grid" id="options-grid"></div>
        </div>
      </main>

      <!-- 答对 / 答错 反馈 -->
      <div class="feedback-overlay" id="feedback-overlay" aria-hidden="true">
        <div class="feedback-card" id="feedback-card">
          <div class="feedback-verdict" id="feedback-verdict">答对啦！</div>
          <p class="feedback-explain" id="feedback-explain"></p>
          <p class="feedback-doctor" id="feedback-doctor"></p>
          <button class="push-btn" id="btn-feedback-next"><span class="push-btn-label">继续</span></button>
        </div>
      </div>
    </section>

    <!-- ============ 关卡结算 ============ -->
    <section class="screen screen-result" id="screen-result">
      <canvas class="confetti-canvas" id="confetti-canvas" aria-hidden="true"></canvas>
      <div class="result-card" id="result-card">
        <div class="result-tree" id="result-tree" aria-hidden="true"></div>
        <div class="result-stars" id="result-stars"></div>
        <h2 class="result-title" id="result-title">关卡完成！</h2>
        <p class="result-summary" id="result-summary"></p>
        <p class="result-tip" id="result-tip"></p>
        <div class="result-actions">
          <button class="push-btn" id="btn-replay"><span class="push-btn-label">再玩一次</span></button>
          <button class="push-btn push-btn--gold" id="btn-next-level"><span class="push-btn-label">下一关</span></button>
          <button class="pill-btn" id="btn-result-map">回到地图</button>
        </div>
      </div>
    </section>

  </div>

  <!-- ============ 全站署名栏（每个页面固定显示） ============ -->
  <footer class="brand-credit" role="contentinfo">
    <span class="credit-item credit-brand">哈皮虎育儿百科</span>
    <span class="credit-sep" aria-hidden="true">·</span>
    <a class="credit-item credit-link" href="https://www.yanyisheng.vip" target="_blank" rel="noopener">yanyisheng.vip</a>
    <span class="credit-sep" aria-hidden="true">·</span>
    <span class="credit-item credit-wx">
      <svg class="credit-wx-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M11.5 3C6 3 1.5 6.9 1.5 11.7c0 2.7 1.4 5 3.7 6.6l-.9 2.8 3.3-1.7c1 .3 2 .5 3.1.5h.6c-.4-1.1-.6-2.2-.6-3.4C10.7 12 14.9 8.3 20 8.3h.5C19.1 5.2 15.6 3 11.5 3z" fill="currentColor" opacity=".9"/>
        <path d="M20.5 10c-4.7 0-8.5 3.2-8.5 7.2 0 4 3.8 7.2 8.5 7.2.9 0 1.8-.1 2.6-.3l3 1.5-.9-2.5c2.2-1.4 3.8-3.6 3.8-5.9 0-4-3.8-7.2-8.5-7.2z" fill="currentColor"/>
      </svg>
      微信公众号：儿科严医生
    </span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
